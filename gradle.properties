kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9.1.0 is the newest release supported by Kotlin 2.4.10, and it predates compile SDK 37.
android.suppressUnsupportedCompileSdk=37.0

#Kotlin/Native
# iOS targets can only be compiled from a macOS host; suppress the warning on other hosts.
kotlin.native.ignoreDisabledTargets=true
